<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe { 
            height: 400px;
            width: 400px;
            border: 1px dashed black;
        }
    </style>
</head>
<body>

    <h1>Testando o uso de uma iframe</h1>

    <p>Acessando o site do 
            <!-- Tamanho padrã do iframe é de 300x150 px, a configuração feita no CSS prevalece caso houver também uma configuração feita na tag do iframe -->
        <iframe src="https://www.cursoemvideo.com" frameborder="0" >

            <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo

            </a>

        </iframe>

        para aprender a programar.
    </p>

    <p>
        O repositório do Guanabara no

        <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500" >

            <a href="https://gustavoguanabara.github.io">GitHub

            </a>
        </iframe>
         também é muito legal!
    </p>
</body>
</html>
